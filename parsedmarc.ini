; parsedmarc は環境変数を直接展開しない前提で、.env の値をこのファイルへ転記して使います。
; さくらインターネットの情報を入れるときは IMAP の項目だけ差し替えてください。
; 安全運用の前提:
; - delete = False のまま、成功メールは archive_folder 配下へ移動
; - 失敗メールは archive_folder/Invalid へ移動
; - 古いアーカイブの削除は cleanup コンテナ側で保持日数を管理

[general]
save_aggregate = True
save_forensic = False
save_smtp_tls = False
strip_attachment_payloads = True
silent = True
debug = False
offline = False

[imap]
host = mail.example.com
port = 993
ssl = True
user = dmarc-reports@example.com
password = change-me

[mailbox]
; 常時監視よりもローカル負荷を抑えるため、既定では必要時実行にしています
watch = False
; 成功/失敗にかかわらず即削除はせず、フォルダ分離で安全に管理します
delete = False
reports_folder = INBOX
; 実行時に Aggregate / Forensic / SMTP-TLS / Invalid がこの配下に作成されます
archive_folder = DMARC/Archive
batch_size = 10

[elasticsearch]
hosts = elasticsearch:9200
ssl = False
timeout = 60
number_of_shards = 1
monthly_indexes = True
